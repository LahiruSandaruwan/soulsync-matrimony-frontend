<div class="min-h-screen bg-gradient-to-br from-pink-50 via-white to-rose-50 flex items-center justify-center px-4" role="main">
  <div class="max-w-md w-full text-center">
    <!-- Error Illustration -->
    <div class="text-8xl mb-6 animate-bounce" role="img" aria-label="Broken heart emoji">💔</div>
    
    <!-- Error Message -->
    <h1 class="text-4xl font-bold text-gray-900 mb-4" id="error-title">
      Oops! Page Not Found
    </h1>
    
    <p class="text-lg text-gray-600 mb-2" aria-describedby="error-title">
      The page you're looking for seems to have vanished into thin air.
    </p>
    
    <p class="text-sm text-gray-500 mb-8">
      Don't worry, even soulmates sometimes take wrong turns! 💕
    </p>
    
    <!-- Action Buttons -->
    <div class="space-y-4">
      <button 
        (click)="goHome()" 
        class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white px-6 py-3 rounded-lg font-semibold hover:from-pink-600 hover:to-rose-600 transition-all duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:ring-offset-2"
        aria-label="Navigate to dashboard homepage"
      >
        🏠 Go to Dashboard
      </button>
      
      <button 
        (click)="goBack()" 
        class="w-full bg-white border border-gray-300 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:bg-gray-50 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
        aria-label="Go back to previous page"
      >
        ← Go Back
      </button>
    </div>
    
    <!-- Help Section -->
    <div class="mt-8 pt-6 border-t border-gray-200">
      <p class="text-sm text-gray-500 mb-3">
        Still having trouble?
      </p>
      <button 
        (click)="reportBrokenLink()" 
        class="text-pink-600 hover:text-pink-700 underline focus:outline-none focus:ring-2 focus:ring-pink-500 focus:ring-offset-2 rounded"
        aria-label="Report this broken link to support team"
      >
        📧 Report Broken Link
      </button>
    </div>
  </div>
</div>
