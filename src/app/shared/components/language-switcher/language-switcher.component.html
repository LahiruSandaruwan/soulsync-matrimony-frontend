<div class="relative">
  <button
    (click)="toggleDropdown()"
    class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors text-gray-700"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="listbox"
    type="button">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
    </svg>
    <span class="text-sm font-medium">{{ currentLang().nativeName }}</span>
    <svg
      class="w-4 h-4 transition-transform duration-200"
      [class.rotate-180]="isOpen"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>

  <div
    *ngIf="isOpen"
    class="absolute right-0 mt-2 w-44 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-50 animate-fade-in"
    role="listbox">
    <button
      *ngFor="let lang of languages"
      (click)="selectLanguage(lang)"
      class="w-full flex items-center gap-3 px-4 py-2.5 text-left hover:bg-gray-50 transition-colors"
      [class.bg-primary-50]="lang.code === currentLang().code"
      [class.text-primary-700]="lang.code === currentLang().code"
      role="option"
      type="button"
      [attr.aria-selected]="lang.code === currentLang().code">
      <span class="text-sm font-medium">{{ lang.nativeName }}</span>
      <span class="text-xs text-gray-400">({{ lang.name }})</span>
      <svg
        *ngIf="lang.code === currentLang().code"
        class="w-4 h-4 ml-auto text-primary-600"
        fill="currentColor"
        viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>
</div>
